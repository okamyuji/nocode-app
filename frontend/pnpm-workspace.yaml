# 公開から7日未満の版を入れない。依存の乗っ取りへの備え。緊急時だけminimumReleaseAgeExcludeにname@versionで1版ずつ足す
minimumReleaseAge: 10080
# @vitest/*はvitestの完全一致のpeerを持つ。vitestだけを上げて版がずれたら、警告で済ませず解決を失敗させる
strictPeerDependencies: true
allowBuilds:
  msw: false
overrides:
  brace-expansion@<1.1.18: ">=1.1.18 <2.0.0"
  brace-expansion@>=2.0.0 <2.1.4: ">=2.1.4 <3.0.0"
  brace-expansion@>=3.0.0 <5.0.9: ">=5.0.9 <6.0.0"
  ws@>=8.0.0 <8.20.1: ">=8.20.1"
  js-yaml@<4.2.0: ">=4.2.0"
  js-yaml@>=5.0.0 <5.2.2: ">=5.2.2"
  form-data@<4.0.6: ">=4.0.6"
  markdown-it@<14.3.3: ">=14.3.3 <15.0.0"
  postcss@<8.5.18: ">=8.5.18 <9.0.0"
  nanoid@<3.3.18: ">=3.3.18 <4.0.0"
  turbo-stream@<3.0.0: ">=3.0.0"
  source-map-js@<1.2.2: ">=1.2.2 <2.0.0"
  katex@<0.18.2: ">=0.18.2 <0.19.0"
  smol-toml@<1.9.0: ">=1.9.0 <2.0.0"
