name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN の権限を最小化する。CI はソースの読み取りのみ行うため contents: read に限定する。
permissions:
  contents: read

jobs:
  security:
    name: gitleaks secret scan
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  backend:
    name: Backend (Go)
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      working-directory: backend
      test-command: "go test -short -race -count=1 ./..."

  backend-integration:
    name: Backend integration (testcontainers, 4 RDB)
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      working-directory: backend
      test-command: "go test -race -count=1 -v -tags=integration -timeout 40m ./internal/repositories/..."

  backend-fmt:
    name: Backend gofmt (no diff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: gofmt (no diff)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt diff detected"
            echo "$unformatted"
            exit 1
          fi

  frontend:
    name: Frontend (TypeScript)
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      working-directory: frontend

  frontend-build:
    name: Frontend format:check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: format:check
        run: pnpm run format:check

      - name: build
        run: pnpm run build
